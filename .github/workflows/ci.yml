name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runbook-conversion:
    name: Testes de conversão do runbook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Rodar os testes de conversão (stdlib, sem dependências)
        run: python3 -m unittest tests.test_runbook_conversion -v

      - name: Confirmar que docs/runbook está em dia com o conversor
        run: |
          python3 tools/convert_runbook.py
          if ! git diff --quiet -- docs/runbook; then
            echo "::error::docs/runbook diverge de tools/convert_runbook.py."
            echo "Rode 'python3 tools/convert_runbook.py' e faça commit da saída."
            git --no-pager diff --stat -- docs/runbook
            exit 1
          fi

  dotnet:
    name: Scaffolding .NET (build, testes, qualidade)
    runs-on: ubuntu-latest
    services:
      # SQL Server efêmero apenas para os testes de integração (destruído ao fim do job; não
      # acessível externamente). A senha abaixo NÃO é um segredo real — é uma credencial
      # descartável deste container de CI (allowlist em .gitleaks.toml).
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Slice1_CI_Ephemeral!9"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Slice1_CI_Ephemeral!9 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      ARCHIVEBRIDGE_TEST_SQL: "Server=localhost,1433;User ID=sa;Password=Slice1_CI_Ephemeral!9;TrustServerCertificate=True;Encrypt=False"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar .NET (SDK fixado pelo global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.110'

      - name: Registrar versão do SDK resolvida
        run: |
          echo "SDK resolvido no CI: $(dotnet --version)"
          dotnet --list-sdks

      - name: Restore reprodutível (locked mode)
        run: dotnet restore ArchiveBridge.sln --locked-mode

      - name: Build Release (warnings as errors via Directory.Build.props)
        run: dotnet build ArchiveBridge.sln --configuration Release --no-restore

      - name: Testes (unitários, arquitetura e integração) em Release
        run: dotnet test ArchiveBridge.sln --configuration Release --no-build --verbosity normal

      - name: Verificar formatação
        run: dotnet format ArchiveBridge.sln --verify-no-changes --no-restore

      - name: SCA — pacotes vulneráveis (JSON estruturado, fail-closed)
        run: |
          set -euo pipefail
          dotnet list ArchiveBridge.sln package --vulnerable --include-transitive \
            --format json --output-version 1 > sca.json
          python3 tools/sca_gate.py sca.json

      - name: Restaurar ferramentas (.config/dotnet-tools.json)
        run: dotnet tool restore

      - name: Gerar SBOM inicial (CycloneDX fixado por versão)
        run: dotnet CycloneDX ArchiveBridge.sln -o sbom -dpr -F Json

      - name: Publicar SBOM como artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom/

  secret-scanning:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
